<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — SAKU AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Albert+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--washi:#F7F2EA;--card:#FDFBF6;--sumi:#1C1B18;--shu:#BF5B38;--shu-deep:#A54A2B;--line:#E4DCCD}
  body{font-family:'Albert Sans',sans-serif;background:var(--washi);color:#6E6A61;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  ::selection{background:var(--shu);color:var(--washi)}
  .jp{font-family:'Zen Kaku Gothic New',sans-serif}
  .card{max-width:520px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(40px,8vw,64px) clamp(28px,6vw,56px);box-shadow:0 2px 6px rgba(28,27,24,.04),0 26px 60px rgba(28,27,24,.08)}
  .btn{display:inline-block;background:var(--shu);color:#FBF4EC;font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;letter-spacing:.04em;padding:15px 32px;border-radius:6px;text-decoration:none;transition:transform .22s cubic-bezier(.2,.9,.3,1.4)}
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <p class="jp" aria-hidden="true" style="font-size:56px;color:var(--shu);line-height:1;margin:0">咲</p>
    <p class="jp" style="font-size:11px;letter-spacing:.3em;color:#A54A2B;text-transform:uppercase;font-weight:500;margin-top:20px">ありがとう — THANK YOU</p>
    <h1 class="jp" style="font-size:clamp(26px,6vw,34px);font-weight:500;color:var(--sumi);letter-spacing:-0.005em;margin:14px 0 0">Your request is in.</h1>
    <p style="font-size:16px;line-height:1.85;margin-top:16px">We'll reply within one business day to set up your call. If it's urgent, write us at
      <a href="mailto:andresbravocardozo@gmail.com" style="color:var(--shu-deep)">andresbravocardozo@gmail.com</a>.
    </p>
    <a class="btn" href="index.html" style="margin-top:30px">Back to the site</a>
  </main>
</body>
</html>
